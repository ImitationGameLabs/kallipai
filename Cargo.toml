[workspace]
members = [
  "crates/kallip-common",
  "crates/platform/kallip-archeion-common",
  "crates/platform/kallip-lesche-common",
  "crates/platform/kallip-archeion",
  "crates/platform/kallip-lesche",
  "crates/platform/kallip-e2ee",
  "crates/platform/kallip-archeion-client",
  "crates/platform/kallip-lesche-client",
  "crates/platform/kallip-admin",
  "crates/kallip-runtime",
  "crates/kallip-shell",
  "crates/kallip",
  "crates/kallip-tagma",
  "crates/kallip-client",
  "crates/kallip-run",
  "crates/time/kallip-cron-common",
  "crates/time/kallip-cron-client",
  "crates/time/kallip-cron",
  "crates/time/kallip-cron-daemon",
  "crates/daemon/kallip-daemon-common",
  "crates/daemon/kallip-daemon-client",
  "crates/daemon/kallip-daemon",
  "crates/daemon/kallip-daemon-spawn",
  "crates/daemon/kallip-task",
  "crates/daemon/kallipctl",
  "crates/platform/kallip-instances",
  "crates/platform/kallip-files",
  "crates/kallip-blob-store",
  "crates/kallip-testkit",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"

[workspace.metadata.crane]
name = "kallip"

[workspace.dependencies]
just-llm-client = { git = "https://github.com/ImitationGameLabs/just-agent-libs.git", rev = "4a9585f", features = [
  "responses",
  "anthropic",
] }

kallip-common = { path = "crates/kallip-common", default-features = false }
kallip-archeion-common = { path = "crates/platform/kallip-archeion-common" }
kallip-lesche-common = { path = "crates/platform/kallip-lesche-common" }
kallip-archeion = { path = "crates/platform/kallip-archeion" }
kallip-lesche = { path = "crates/platform/kallip-lesche" }
kallip-e2ee = { path = "crates/platform/kallip-e2ee" }
kallip-archeion-client = { path = "crates/platform/kallip-archeion-client" }
kallip-lesche-client = { path = "crates/platform/kallip-lesche-client" }
kallip-runtime = { path = "crates/kallip-runtime" }
kallip-shell = { path = "crates/kallip-shell" }
kallip-client = { path = "crates/kallip-client" }
kallip-tagma = { path = "crates/kallip-tagma" }
kallip-cron-common = { path = "crates/time/kallip-cron-common" }
kallip-cron-client = { path = "crates/time/kallip-cron-client" }
kallip-cron-daemon = { path = "crates/time/kallip-cron-daemon" }
kallip-daemon-common = { path = "crates/daemon/kallip-daemon-common" }
kallip-daemon-client = { path = "crates/daemon/kallip-daemon-client" }
kallip-daemon = { path = "crates/daemon/kallip-daemon" }
kallip-daemon-spawn = { path = "crates/daemon/kallip-daemon-spawn" }
kallip-task = { path = "crates/daemon/kallip-task" }
kallipctl = { path = "crates/daemon/kallipctl" }
kallip-instances = { path = "crates/platform/kallip-instances" }
kallip-blob-store = { path = "crates/kallip-blob-store" }
kallip-files = { path = "crates/platform/kallip-files" }
kallip-testkit = { path = "crates/kallip-testkit" }

anyhow = "1.0.102"
async-trait = "0.1.89"
async-stream = "0.3.6"
# RFC 5321/5322 email validation for archeion login ids; pure-Rust, no heavy deps.
email_address = "0.2.9"
# `signal` transitively enables `process` (for `nix::unistd::Pid`).
nix = { version = "0.31", features = ["fs", "signal", "user"] }
# Linux-first sandbox toolbox (landlock ruleset + mount-ns composable
# `prepare_*`/`install_*` primitives). Used only behind the `landlock` feature of
# kallip-shell, which is Linux-only. `default-features = false` drops its
# tokio proxy runtime — we only consume the spawn-independent primitives.
libsandbox = { git = "https://github.com/ImitationGameLabs/libsandbox-rs.git", rev = "979de21ae3f8a05d7efa0ff891343380b3622473", default-features = false }
libc = "0.2"
futures-core = "0.3.32"
futures-util = "0.3.32"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream",
] }
bincode = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
# Match sea-orm's sqlx (0.8); the tagma names SqliteConnectOptions for PRAGMAs.
sqlx = { version = "0.8", default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "sync",
  "time",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }

axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sea-orm = { version = "1.1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-uuid",
  "with-time",
  "with-json",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", default-features = false, features = [
  "postgres",
] }
url = "2.5"
percent-encoding = "2.3.2"
# Pinned to the first pure-Rust (crypto-glue) release; bump to stable release when out.
webauthn-rs = { version = "=0.6.1-dev", features = [
  "danger-allow-state-serialisation",
  "conditional-ui",
  "danger-credential-internals",
] }
# Used directly for discoverable-credential registration: the high-level wrapper
# hardcodes require_resident_key=false and keeps its `core` field private, so we
# construct our own WebauthnCore to set require_resident_key(true). Bump alongside
# webauthn-rs.
webauthn-rs-core = "=0.6.1-dev"
cookie = "0.18"
base64 = "0.22"
hex = "0.4"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2"
x25519-dalek = "3"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
hkdf = "0.13"
# Securely zero secret key material on drop.
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily-rolling log files for managed instances (see kallip-tagma's logging).
tracing-appender = "0.2"
rable = "0.2.0"
clap = { version = "4.6", features = ["derive", "env"] }
comfy-table = "7.2.2"
dirs = "6"
ipnet = "2.12"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
toml = "1"
tar = "0.4.46"
arc-swap = "1"
tokenx-rs = "0.1"
temp-env = "0.3"
tempfile = "3"
http-body-util = "0.1"
wiremock = "0.6.5"
serial_test = "3.5.0"
# Dev-only: process-start constructor for the tagma test harness — installs a global default tracing subscriber before any test thread runs (callsite interest-cache race guard).
ctor = "1.0.13"
# Dev-only: the `spawn` benchmark in kallip-shell (criterion). Not a runtime dep.
criterion = "0.8.2"
