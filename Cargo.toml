[workspace]
members = [
  "crates/kallipai-common",
  "crates/platform/kallipai-archeion-common",
  "crates/platform/kallipai-lesche-common",
  "crates/platform/kallipai-archeion",
  "crates/platform/kallipai-lesche",
  "crates/platform/kallipai-e2ee",
  "crates/platform/kallipai-archeion-client",
  "crates/platform/kallipai-lesche-client",
  "crates/platform/kallipai-admin",
  "crates/kallipai-adk",
  "crates/kallipai-shell",
  "crates/kallip",
  "crates/kallipai-tagma",
  "crates/kallipai-client",
  "crates/kallipai-run",
  "crates/time/kallipai-cron-common",
  "crates/time/kallipai-cron-client",
  "crates/time/kallipai-cron",
  "crates/time/kallipai-cron-daemon",
  "crates/daemon/kallipai-daemon-common",
  "crates/daemon/kallipai-daemon-client",
  "crates/daemon/kallipai-daemon",
  "crates/daemon/kallipai-daemon-spawn",
  "crates/daemon/kallipai-task",
  "crates/daemon/kallipctl",
  "crates/platform/kallipai-instances",
  "crates/platform/kallipai-files",
  "crates/platform/kallipai-model-gateway",
  "crates/kallipai-blob-store",
  "crates/kallipai-testkit",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"

[workspace.metadata.crane]
name = "kallipai"

[workspace.dependencies]
just-llm-client = { git = "https://github.com/ImitationGameLabs/just-agent-libs.git", rev = "ec10078", features = [
  "full",
] }

kallipai-common = { path = "crates/kallipai-common", default-features = false }
kallipai-archeion-common = { path = "crates/platform/kallipai-archeion-common" }
kallipai-lesche-common = { path = "crates/platform/kallipai-lesche-common" }
kallipai-archeion = { path = "crates/platform/kallipai-archeion" }
kallipai-lesche = { path = "crates/platform/kallipai-lesche" }
kallipai-e2ee = { path = "crates/platform/kallipai-e2ee" }
kallipai-archeion-client = { path = "crates/platform/kallipai-archeion-client" }
kallipai-lesche-client = { path = "crates/platform/kallipai-lesche-client" }
kallipai-adk = { path = "crates/kallipai-adk" }
kallipai-shell = { path = "crates/kallipai-shell" }
kallipai-client = { path = "crates/kallipai-client" }
kallipai-tagma = { path = "crates/kallipai-tagma" }
kallipai-cron-common = { path = "crates/time/kallipai-cron-common" }
kallipai-cron-client = { path = "crates/time/kallipai-cron-client" }
kallipai-cron-daemon = { path = "crates/time/kallipai-cron-daemon" }
kallipai-daemon-common = { path = "crates/daemon/kallipai-daemon-common" }
kallipai-daemon-client = { path = "crates/daemon/kallipai-daemon-client" }
kallipai-daemon = { path = "crates/daemon/kallipai-daemon" }
kallipai-daemon-spawn = { path = "crates/daemon/kallipai-daemon-spawn" }
kallipai-task = { path = "crates/daemon/kallipai-task" }
kallipctl = { path = "crates/daemon/kallipctl" }
kallipai-instances = { path = "crates/platform/kallipai-instances" }
kallipai-blob-store = { path = "crates/kallipai-blob-store" }
kallipai-files = { path = "crates/platform/kallipai-files" }
kallipai-testkit = { path = "crates/kallipai-testkit" }

anyhow = "1.0.102"
async-trait = "0.1.89"
async-stream = "0.3.6"
# RFC 5321/5322 email validation for archeion login ids; pure-Rust, no heavy deps.
email_address = "0.2.9"
# `signal` transitively enables `process` (for `nix::unistd::Pid`).
nix = { version = "0.31", features = ["fs", "signal", "user"] }
# Linux-first sandbox toolbox (landlock ruleset + mount-ns composable
# `prepare_*`/`install_*` primitives). Used only behind the `landlock` feature of
# kallipai-shell, which is Linux-only. `default-features = false` drops its
# tokio proxy runtime — we only consume the spawn-independent primitives.
libsandbox = { git = "https://github.com/ImitationGameLabs/libsandbox-rs.git", rev = "979de21ae3f8a05d7efa0ff891343380b3622473", default-features = false }
libc = "0.2"
futures-core = "0.3.32"
futures-util = "0.3.32"
pingora = { version = "=0.9.0", features = ["proxy", "rustls"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream",
] }
bincode = "1"
bytes = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
# Match sea-orm's sqlx (0.8); the tagma names SqliteConnectOptions for PRAGMAs.
sqlx = { version = "0.8", default-features = false }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "sync",
  "time",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }

axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sea-orm = { version = "1.1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-uuid",
  "with-time",
  "with-json",
] }
sea-orm-migration = { version = "1.1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", default-features = false, features = [
  "postgres",
] }
url = "2.5"
percent-encoding = "2.3.2"
# Pinned to the first pure-Rust (crypto-glue) release; bump to stable release when out.
webauthn-rs = { version = "=0.6.1-dev", features = [
  "danger-allow-state-serialisation",
  "conditional-ui",
  "danger-credential-internals",
] }
# Used directly for discoverable-credential registration: the high-level wrapper
# hardcodes require_resident_key=false and keeps its `core` field private, so we
# construct our own WebauthnCore to set require_resident_key(true). Bump alongside
# webauthn-rs.
webauthn-rs-core = "=0.6.1-dev"
cookie = "0.18"
base64 = "0.22"
hex = "0.4"
getrandom = "0.4"
sha2 = "0.11"
subtle = "2"
x25519-dalek = "3"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
hkdf = "0.13"
# Securely zero secret key material on drop.
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily-rolling log files for managed instances (see kallipai-tagma's logging).
tracing-appender = "0.2"
rable = "0.2.0"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = "7.2.2"
dirs = "6"
ipnet = "2.12"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
jiff = { version = "0.2", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
] }
toml = "1"
tar = "0.4.46"
arc-swap = "1"
tokenx-rs = "0.1"
temp-env = "0.3"
tempfile = "3"
# Blob-store compression: the zstd binding drives both the encode pass
# (pledged source size + checksum in the frame header) and the decode /
# frame-magic sniffing on the read side.
zstd = "0.14.0"
zstd-safe = "8.0.0"
http = "1.5.0"
http-body-util = "0.1"
wiremock = "0.6.5"
serial_test = "3.5.0"
# Dev-only: process-start constructor for the tagma test harness — installs a global default tracing subscriber before any test thread runs (callsite interest-cache race guard).
ctor = "1.0.13"
# Dev-only: the `spawn` benchmark in kallipai-shell (criterion). Not a runtime dep.
criterion = "0.8.2"
