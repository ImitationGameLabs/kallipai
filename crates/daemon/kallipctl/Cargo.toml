[package]
name = "kallipctl"
description = "Management CLI (kallipctl) for the kallipai local daemon"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
kallipai-daemon-client = { workspace = true }
kallipai-blob-store = { workspace = true }
kallipai-daemon-common = { workspace = true }
kallipai-common = { workspace = true, features = ["propagation"] }
kallipai-archeion-client = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true, features = ["unstable-dynamic"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "signal"] }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
time = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
