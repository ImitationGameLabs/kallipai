[package]
name = "kallip-cron-daemon"
description = "Timer/notification daemon that schedules events and injects them into agent conversations"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
kallip-cron-common = { workspace = true }
kallip-common = { workspace = true, features = ["axum"] }
kallip-client = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
