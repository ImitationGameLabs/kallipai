[package]
name = "kallipai-cron-client"
description = "HTTP client for the kallipai-cron timer daemon"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
kallipai-cron-common = { workspace = true }
kallipai-common = { workspace = true, features = ["propagation"] }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net"] }
axum = { workspace = true }
kallipai-common = { workspace = true, features = ["test-support"] }
