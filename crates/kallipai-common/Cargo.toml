[package]
name = "kallipai-common"
description = "Shared types and command parsing for kallipai"
edition = "2024"
version.workspace = true
license.workspace = true

[features]
default = ["axum"]
axum = ["dep:axum", "dep:tower-http"]
logging = ["dep:tracing-subscriber", "dep:tracing-appender"]
telemetry = [
  "logging",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
  "dep:async-trait",
  "dep:http",
  "dep:reqwest",
  "dep:reqwest-middleware",
]
test-support = ["telemetry"]

[dependencies]
axum = { workspace = true, optional = true }
anyhow = { workspace = true }
futures-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["local-offset"] }
jiff = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tower-http = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
uuid = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true }
kallipai-testkit = { workspace = true }
# The `log` bridge guard test (tests/log_bridge.rs) drives the real `log`
# facade, so the crate needs it in test builds:
log = { workspace = true }
