[package]
name = "kallip"
description = "Agent CLI: tagma client"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
kallipai-blob-store = { workspace = true }
kallipai-client = { workspace = true }
kallipai-common = { workspace = true, features = ["propagation"] }
kallipai-lesche-common = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["io"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
# The file client is a middleware client, so its requests are built by
# reqwest-middleware's builder, and `.query` is the extension those calls need.
reqwest-middleware = { workspace = true, features = ["query"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
kallipai-files = { workspace = true }
kallipai-testkit = { workspace = true }
kallipai-archeion-common = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
testcontainers = { workspace = true, features = ["reusable-containers"] }
testcontainers-modules = { workspace = true }
kallipai-common = { workspace = true, features = ["test-support"] }
