[package]
name = "kallip"
description = "Agent CLI: tagma client"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
kallip-client = { workspace = true }
kallip-common = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
kallip-runtime = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
kallip-files = { workspace = true }
kallip-testkit = { workspace = true }
kallip-archeion-common = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
testcontainers = { workspace = true, features = ["reusable-containers"] }
testcontainers-modules = { workspace = true }
