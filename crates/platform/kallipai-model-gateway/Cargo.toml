[package]
name = "kallipai-model-gateway"
description = "kallipai model gateway: profiles distribution face + credential-injecting forward face"
edition = "2024"
version.workspace = true
license.workspace = true

[[bin]]
name = "kallipai-model-gateway"
path = "src/main.rs"

[dependencies]
kallipai-common = { workspace = true, features = ["axum", "logging"] }
kallipai-archeion-common = { workspace = true }
cookie = { workspace = true }
axum = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
sqlx = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
pingora = { workspace = true }
prometheus = { workspace = true, features = ["process"] }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
just-llm-client = { workspace = true }
testcontainers = { workspace = true, features = ["reusable-containers"] }
testcontainers-modules = { workspace = true }
tempfile = { workspace = true }
