[package]
name = "kallipai-lesche"
description = "kallipai data-plane relay: tagma tunnels, app event streams, envelope relay"
edition = "2024"
version.workspace = true
license.workspace = true

[[bin]]
name = "kallipai-lesche"
path = "src/main.rs"

[dependencies]
kallipai-archeion-common = { workspace = true }
kallipai-lesche-common = { workspace = true }
kallipai-common = { workspace = true, features = ["axum", "logging"] }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
cookie = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
wiremock = { workspace = true }
testcontainers = { workspace = true, features = ["reusable-containers"] }
testcontainers-modules = { workspace = true }
