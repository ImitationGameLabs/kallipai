[package]
name = "kallip-herald"
description = "Host-side relay connector: links a kallip-tagma to kallip-agora"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
kallip-common = { workspace = true }
kallip-agora-common = { workspace = true }
kallip-e2ee = { workspace = true }
kallip-agora-client = { workspace = true }
kallip-lesche-client = { workspace = true }
kallip-client = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net"] }
# Test-only: the op_tests module simulates the app side of the E2E channel.
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
x25519-dalek = { workspace = true, features = ["reusable_secrets"] }
