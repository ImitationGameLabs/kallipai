<!doctype html>
<html lang="en" data-theme="rocket">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      // Set data-mode before first paint so light-dark() utilities and the
      // `dark:` variant resolve without a flash. Manual choice (localStorage)
      // wins; otherwise follow the OS preference (default light).
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("mode");
        } catch {
          // Storage access can be blocked (private mode); fall through
          // to the OS preference.
        }
        const dark =
          stored === "dark" ||
          (stored === null &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      })();
      // Mirror the Paraglide locale strategy (cookie > navigator.languages
      // > baseLocale) for <html lang> before hydration; LanguageSwitch
      // keeps it in sync after user changes. NOTE: the (en|zh) set below and
      // the zh-only navigator probe duplicate settings.json's locale list;
      // adding a locale means updating this script in BOTH apps' app.html.
      (() => {
        const cookie = document.cookie.match(/(?:^|;\s*)PARAGLIDE_LOCALE=(en|zh)/);
        if (cookie) {
          document.documentElement.lang = cookie[1];
        } else if (navigator.languages?.some((l) => l.startsWith("zh"))) {
          document.documentElement.lang = "zh";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
